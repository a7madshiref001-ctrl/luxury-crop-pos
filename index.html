<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F0E8">
<title>محصول فاخر · نظام الكاشير</title>
<link rel="icon" href="assets/brand/logo-mark.png" type="image/png">
<link rel="stylesheet" href="assets/darj.css?v=1">
<link rel="stylesheet" href="assets/brand.css?v=1">
<style>
  body{min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  .hub{width:min(560px,100%);display:grid;gap:18px}
  .hub__h{display:grid;justify-items:center;gap:12px;text-align:center;margin-bottom:6px}
  .hub__h img{width:64px;height:64px}
  .hub__h b{font-family:var(--f-en);font-weight:700;font-size:26px;letter-spacing:.12em}
  .hub__h p{color:var(--muted)}
  .go{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .15s}
  .go:hover{border-color:var(--ink);transform:translateY(-2px)}
  .go .dev__i{width:46px;height:46px;border-radius:14px;background:var(--paper);display:grid;place-items:center}
  .go .bi>b{font-size:17px}
  .go .bi>small{font-size:13px}
  .go .ico:last-child{margin-inline-start:auto;color:var(--muted)}
  .main-go{background:var(--ink);color:#fff;border-color:var(--ink)}
  .main-go .dev__i{background:rgba(255,255,255,.1);color:#fff}
  .main-go .ico:last-child{color:rgba(255,255,255,.6)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
  .foot a{font-family:var(--f-en)}
</style>
</head>
<body>
<div class="hub">
  <div class="hub__h"><img src="assets/brand/logo-mark.png" alt=""><b>LUXURY CROP</b><p>نظام الكاشير · محصول فاخر</p></div>
  <a class="go main-go" href="app.html" data-i="register" data-en="Cashier" data-ar="الكاشير — البيع والوردية والتقارير"></a>
  <a class="go" href="kds.html" data-i="cup" data-en="Barista" data-ar="شاشة التحضير للبار"></a>
  <a class="go" href="screen.html" data-i="kds" data-en="Order board" data-ar="شاشة «طلبك جاهز» للعملاء"></a>
  <a class="go" href="screen.html?mode=cart" data-i="user" data-en="Customer display" data-ar="شاشة العميل عند الكاشير"></a>
  <p class="foot"><a href="https://a7madshiref001-ctrl.github.io/athr/" target="_blank" rel="noopener" lang="en">Built by ATHR</a></p>
</div>
<script src="assets/config.js?v=1"></script>
<script src="assets/menu.js?v=1"></script>
<script src="assets/darj.js?v=1"></script>
<script>
document.querySelectorAll('.go').forEach(function (a) {
  a.innerHTML = '<span class="dev__i">' + DARJ.icon(a.dataset.i) + '</span><span class="bi"><b>' + a.dataset.en + '</b><small>' + a.dataset.ar + '</small></span>' + DARJ.icon('chev');
});
</script>
</body>
</html>
